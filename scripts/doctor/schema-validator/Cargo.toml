[package]
name = "doctor-schema-validator"
version = "0.1.0"
edition = "2024"
publish = false
description = "CI-only Draft 2020-12 validator for the GoalLatch Doctor Core V1 JSON contract"

# Deliberately its own workspace so the pinned validator dependency graph never
# enters the runtime package, its Cargo.lock or its Nix build inputs. This crate
# is a CI tool: it is never built for a release artifact.
[workspace]

[[bin]]
name = "doctor-schema-validator"
path = "src/main.rs"

[dependencies]
jsonschema = { version = "=0.26.0", default-features = false }
serde_json = "=1.0.140"
