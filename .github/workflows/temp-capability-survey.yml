# TEMPORARY (ci/public-matrix-closure-v1): capability survey.
#
# Question: can the pinned upstream Bubblewrap build a sandbox unprivileged on
# any hosted Linux image? The `test (ubuntu-x64)` job cannot, and util-linux
# `unshare -Ur` failing is not decisive: on ubuntu-26.04 `unshare` fails while
# the distribution's bubblewrap 0.11.1 succeeds with the same namespaces.
#
# Builds the pinned commit and both release tags and probes each, so the suite
# is placed on a runtime and a runner that can actually run it. Delete once the
# answer is recorded.
name: TEMP sandbox capability survey

on:
  workflow_dispatch:
  push:
    branches:
      - ci/public-matrix-closure-v1
    paths:
      - .github/workflows/temp-capability-survey.yml

permissions:
  contents: read

concurrency:
  group: temp-sandbox-survey
  cancel-in-progress: true

jobs:
  survey:
    name: survey (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            runner: ubuntu-22.04
          - name: ubuntu-24.04
            runner: ubuntu-24.04
          - name: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
          - name: ubuntu-26.04
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the build and clone Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
          git clone --quiet https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          git -C "$RUNNER_TEMP/bubblewrap" log --oneline -1 2a76602a8c71f36c1527cf9fc3417d9149822e0c || true
          for ref in 2a76602a8c71f36c1527cf9fc3417d9149822e0c v0.12.0 v0.13.0; do
            dir="$RUNNER_TEMP/bw-${ref:0:12}"
            git -C "$RUNNER_TEMP/bubblewrap" worktree add --quiet --detach "$dir" "$ref"
            meson setup "$dir/build" "$dir" --prefix="$dir/prefix" \
              -Dselinux=disabled -Dman=disabled -Dtests=false \
              -Dbash_completion=disabled -Dzsh_completion=disabled >/dev/null
            meson compile -C "$dir/build" >/dev/null
            echo "BUILT $ref -> $dir/build/bwrap"
          done

      - name: Probe every runtime
        shell: bash
        run: |
          set +e
          printf '### host\n'
          uname -a
          id
          if command -v bwrap >/dev/null 2>&1; then
            echo "--- distribution bwrap"
            bwrap --version 2>&1
          else
            echo "no distribution bwrap"
          fi
          for dir in "$RUNNER_TEMP"/bw-*; do
            bin="$dir/build/bwrap"
            [ -x "$bin" ] || continue
            printf '### %s\n' "$(basename "$dir")"
            "$bin" --version 2>&1
            "$bin" --new-session --die-with-parent --unshare-user --unshare-pid \
              --ro-bind / / --proc /proc -- /bin/sh -c 'id -u; echo FS_OK' 2>&1
            printf 'FS_rc=%s\n' "$?"
            "$bin" --new-session --die-with-parent --unshare-user --unshare-pid --unshare-net \
              --ro-bind / / --proc /proc -- /bin/sh -c 'id -u; echo NET_OK' 2>&1
            printf 'NET_rc=%s\n' "$?"
          done
          exit 0
