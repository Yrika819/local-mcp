name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - name: Install Linux sandbox runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Diagnose Linux user namespaces before repair
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uname -a
          sysctl kernel.unprivileged_userns_clone || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sysctl user.max_user_namespaces || true
          which bwrap
          bwrap --version
          set +e
          bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user /bin/true
          status=$?
          set -e
          echo "pre_fix_bwrap_status=${status}"
      - name: Enable Linux sandbox user namespaces on CI runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify Linux user namespaces after repair
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sysctl kernel.unprivileged_userns_clone || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sysctl user.max_user_namespaces || true
          bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user /bin/true
      - name: Build Linux sandbox helper
        if: runner.os == 'Linux'
        run: cargo build --locked --bin codex-linux-sandbox
      - name: Test
        env:
          LOCAL_MCP_TEST_ALLOW_LINUX_NETWORK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --locked --all-targets
      - name: Build release
        run: cargo build --release --locked
