name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - name: Install Linux sandbox runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build Linux sandbox helper
        if: runner.os == 'Linux'
        run: cargo build --locked --bin codex-linux-sandbox
      - name: Test
        env:
          LOCAL_MCP_TEST_ALLOW_LINUX_NETWORK: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --locked --all-targets
      - name: Build release
        run: cargo build --release --locked
